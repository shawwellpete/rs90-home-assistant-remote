              min-height: 130px;
              background-color: {% if state_attr('media_player.family_room_amp','sound_mode') == 'all_ch_stereo' %}
                rgba(255, 165, 0, 0.22)
              {% else %}
                rgba(0, 128, 255, 0.12)
              {% endif %};
            }
            .primary { font-size: 13px; font-weight: 700; text-align: center; }
            ha-state-icon { --mdc-icon-size: 32px; }

      # ── ROW 2: DSP flavours ───────────────────────────────────────

      - type: custom:mushroom-template-card
        icon: mdi:theater
        primary: Drama
        secondary: ""
        layout: vertical
        icon_color: >
          {% if state_attr('media_player.family_room_amp','sound_mode') == 'drama' %}orange{% else %}grey{% endif %}
        tap_action:
          action: call-service
          service: media_player.select_sound_mode
          data:
            sound_mode: drama
          target:
            entity_id: media_player.family_room_amp
        card_mod:
