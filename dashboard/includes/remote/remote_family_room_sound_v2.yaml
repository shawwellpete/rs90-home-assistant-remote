        layout: vertical
        icon_color: >
          {% if state_attr('media_player.family_room_amp','sound_mode') == 'mono_movie' %}orange{% else %}grey{% endif %}
        tap_action:
          action: call-service
          service: media_player.select_sound_mode
          data:
