            ha-card {
              border-radius: 12px;
              min-height: 130px;
              background-color: {% if state_attr('media_player.family_room_amp','sound_mode') == 'drama' %}
                rgba(255, 165, 0, 0.22)
              {% else %}
                rgba(0, 128, 255, 0.12)
              {% endif %};
            }
            .primary { font-size: 13px; font-weight: 700; text-align: center; }
            ha-state-icon { --mdc-icon-size: 32px; }

      - type: custom:mushroom-template-card
        icon: mdi:stadium
        primary: Spectacle
        secondary: ""
        layout: vertical
        icon_color: >
          {% if state_attr('media_player.family_room_amp','sound_mode') == 'spectacle' %}orange{% else %}grey{% endif %}
        tap_action:
          action: call-service
          service: media_player.select_sound_mode
          data:
            sound_mode: spectacle
          target:
            entity_id: media_player.family_room_amp
        card_mod:
