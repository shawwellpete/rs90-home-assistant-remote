  ####################################################
  # ROW 4: BLINDS
  ####################################################
  - type: grid
    columns: 2
    square: false
    cards:

      - type: custom:mushroom-template-card
        primary: Blinds up
        icon: mdi:blinds-open
        tap_action:
          action: call-service
          service: cover.open_cover
          target:
            entity_id: cover.family_room_blinds
        icon_color: |-
          {% if is_state('cover.family_room_blinds','open') %}
          #00C853
          {% else %}
          grey
          {% endif %}
        card_mod:
          style: |
            ha-card {
              border-radius: 14px;
              min-height: 106px;
              padding: 16px;
              background-color: {% if is_state('cover.family_room_blinds','open') %}
                rgba(0, 200, 83, 0.20)
              {% else %}
                rgba(128, 128, 128, 0.15)
              {% endif %};
            }
            .primary { font-size: 22px; font-weight: 700; }
            ha-state-icon { --mdc-icon-size: 36px; }

      - type: custom:mushroom-template-card
        primary: Down
        icon: mdi:blinds
        tap_action:
          action: call-service
          service: cover.close_cover
          target:
            entity_id: cover.family_room_blinds
        icon_color: |-
          {% if is_state('cover.family_room_blinds','closed') %}
          #00C853
          {% else %}
          grey
          {% endif %}
        card_mod:
          style: |
