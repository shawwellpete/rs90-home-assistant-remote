  ####################################################
  # ROW 2 (2-col): 6 scenes
  ####################################################
  - type: grid
    columns: 2
    square: false
    cards:

      - type: custom:mushroom-template-card
        primary: Standard
        icon: mdi:brightness-6
        tap_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.downstairs_standard
        icon_color: |-
          {% if is_state('input_select.light_style', 'standard') %}
          orange
          {% else %}
          grey
          {% endif %}
        card_mod:
          style: |
            ha-card {
              border-radius: 14px;
              min-height: 106px;
              padding: 12px;
              background-color: {% if is_state('input_select.light_style', 'standard') %}
                rgba(255, 165, 0, 0.22)
              {% else %}
                rgba(128, 128, 128, 0.15)
              {% endif %};
            }
            .primary { font-size: 16px; font-weight: 700; text-align: center; }
            ha-state-icon { --mdc-icon-size: 30px; }

